name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Run coding standards check
        run: composer cs-check

  woo-smoke:
    name: Woo runtime (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture_root
          MYSQL_DATABASE: better_route_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      WP_CLI_CACHE_DIR: /tmp/better-route-wp-cli-cache
      WP_PATH: /tmp/better-route-wordpress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom
          coverage: none
          tools: composer:v2, wp-cli
      - name: Install library dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install OpenAPI test validator and export contracts
        run: |
          python -m pip install -r tests/openapi/requirements.txt
          php tests/openapi/export.php "$RUNNER_TEMP/better-route-openapi.json"
      - name: Install disposable WordPress and WooCommerce
        run: |
          wp core download --path="$WP_PATH" --version=6.9.4
          wp config create --path="$WP_PATH" --dbname=better_route_fixture --dbuser=root --dbpass=fixture_root --dbhost=127.0.0.1:3306
          wp core install --path="$WP_PATH" --url=http://localhost --title='Better Route fixture' --admin_user=fixture_admin --admin_password=fixture_admin_local --admin_email=fixture@example.invalid --skip-email
          wp plugin install woocommerce --path="$WP_PATH" --version=10.9.4 --activate
      - name: Validate services and analytics in HPOS and CPT modes
        run: |
          wp eval "require '$GITHUB_WORKSPACE/tests/smoke/ownership-smoke.php';" --path="$WP_PATH"
          for mode in yes no; do
            wp option update woocommerce_custom_orders_table_enabled "$mode" --path="$WP_PATH"
            wp eval 'WC_Install::create_tables();' --path="$WP_PATH"
            export BR_OPENAPI_SAMPLE_DIR="$RUNNER_TEMP/better-route-openapi-samples"
            wp eval "require '$GITHUB_WORKSPACE/tests/smoke/woo-services-smoke.php';" --path="$WP_PATH"
            wp eval "require '$GITHUB_WORKSPACE/tests/smoke/woo-analytics-smoke.php';" --path="$WP_PATH"
            python tests/openapi/validate.py "$RUNNER_TEMP/better-route-openapi.json" "$BR_OPENAPI_SAMPLE_DIR/services.json" "$BR_OPENAPI_SAMPLE_DIR/analytics.json"
          done

  openapi:
    name: OpenAPI 3.1 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: python -m pip install -r tests/openapi/requirements.txt
      - name: Validate serialized documents and positive/negative samples
        run: |
          php tests/openapi/export.php "$RUNNER_TEMP/better-route-openapi.json"
          python tests/openapi/validate.py "$RUNNER_TEMP/better-route-openapi.json"
